name: Deploy save converter

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/web_save.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript and run offline converter tests
        run: |
          node --check web/app.mjs
          node --check web/save.mjs
          node tests/web_save.mjs
      - name: Prepare website files
        run: |
          mkdir _site
          cp web/index.html web/style.css web/app.mjs web/save.mjs web/data.json _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
